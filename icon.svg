<svg xmlns="http://www.w3.org/2000/svg" viewBox="58 58 140 140" width="256" height="256" fill="none">
  <defs>
    <!-- Deep Charcoal App Tile -->
    <linearGradient id="bg-tile" x1="16" y1="16" x2="240" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E1E24"/>
      <stop offset="100%" stop-color="#0D0D11"/>
    </linearGradient>

    <!-- Primary Accent Gradient (Violet -> Cyan -> Emerald) -->
    <linearGradient id="graph-accent" x1="80" y1="168" x2="180" y2="76" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="52%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>

    <!-- Soft Canvas Glow -->
    <radialGradient id="canvas-glow" cx="152" cy="108" r="76" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Modern Squircle Base -->
  <rect x="58" y="58" width="140" height="140" rx="28" fill="url(#bg-tile)"/>
  <rect x="16.75" y="16.75" width="222.5" height="222.5" rx="55.25" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1.5"/>

  <!-- Subtle Dot-Grid Canvas (Signals Diagrams, Whiteboards & Structured Notes) -->
  <g fill="#52525B" fill-opacity="0.45">
    <circle cx="84" cy="84" r="2.5"/><circle cx="113" cy="84" r="2.5"/><circle cx="142" cy="84" r="2.5"/><circle cx="171" cy="84" r="2.5"/>
    <circle cx="84" cy="113" r="2.5"/><circle cx="113" cy="113" r="2.5"/><circle cx="142" cy="113" r="2.5"/><circle cx="171" cy="113" r="2.5"/>
    <circle cx="84" cy="142" r="2.5"/><circle cx="113" cy="142" r="2.5"/><circle cx="142" cy="142" r="2.5"/><circle cx="171" cy="142" r="2.5"/>
    <circle cx="84" cy="171" r="2.5"/><circle cx="113" cy="171" r="2.5"/><circle cx="142" cy="171" r="2.5"/><circle cx="171" cy="171" r="2.5"/>
  </g>

  <!-- Note Document Frame (glow only, no stroke) -->
  <rect x="58" y="58" width="140" height="140" rx="28" fill="url(#canvas-glow)"/>

  <!-- Top-Left: Text @[/] Note Lines -->
  <rect x="82" y="82" width="44" height="9" rx="4.5" fill="#F4F4F5"/>
  <rect x="82" y="100" width="30" height="8" rx="4" fill="#A1A1AA"/>

  <!-- Bottom-Left: Embedded Mini Bar Chart -->
  <rect x="82" y="152" width="9" height="20" rx="4.5" fill="#8B5CF6"/>
  <rect x="97" y="138" width="9" height="34" rx="4.5" fill="#6366F1"/>
  <rect x="112" y="145" width="9" height="27" rx="4.5" fill="#38BDF8"/>

  <!-- Right Side: Connected Node Diagram @[/] Trend Graph -->
  <path d="M132 146L150 120L172 94" stroke="url(#graph-accent)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M150 120L172 144" stroke="#38BDF8" stroke-opacity="0.65" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Diagram Nodes -->
  <circle cx="132" cy="146" r="7" fill="#18181B" stroke="#8B5CF6" stroke-width="4.5"/>
  <circle cx="150" cy="120" r="8" fill="#18181B" stroke="#38BDF8" stroke-width="4.5"/>
  <circle cx="172" cy="94" r="8" fill="#34D399"/>
  <circle cx="172" cy="144" r="6.5" fill="#18181B" stroke="#38BDF8" stroke-width="4"/>
</svg>